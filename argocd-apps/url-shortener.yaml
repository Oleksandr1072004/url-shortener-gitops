apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: url-shortener
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Oleksandr1072004/url-shortener-gitops.git
    targetRevision: main
    path: charts/url-shortener
    helm:
      valueFiles:
        - values-minikube.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: url-shortener
  syncPolicy:
    automated:
      prune: true
      selfHeal: false  # Увімкнемо в п. 6а
    syncOptions:
      - CreateNamespace=true
