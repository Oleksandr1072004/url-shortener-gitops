apiVersion: v1
kind: Service
metadata:
  name: {{ include "url-shortener.fullname" . }}-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "url-shortener.selectorLabels" . | nindent 4 }}
    app: api-gateway
  ports:
    - name: http
      port: 8000
      targetPort: 8000