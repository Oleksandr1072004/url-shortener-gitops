apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: url-shortener
spec:
  selector:
    app: db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: url-shortener
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - {name: POSTGRES_USER, value: shortener}
            - {name: POSTGRES_PASSWORD, value: secret}
            - {name: POSTGRES_DB, value: shortener_db}
          ports:
            - containerPort: 5432
